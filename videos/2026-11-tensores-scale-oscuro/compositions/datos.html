<!-- OTROS DATOS (5,7 s) — el sonido es una lista larga de números (1D); un texto, palabras convertidas en números (2D). -->
<template>
  <style>#root { position: absolute; inset: 0; } .et { opacity: 0; } #root .w { display: inline-block; } </style>
  <div id="root" data-composition-id="datos" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="d-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore>
      <div id="d-a1" class="ancla"><div class="rot mono et" id="d-w1">hola</div></div>
      <div id="d-a2" class="ancla"><div class="rot mono et" id="d-w2">qué</div></div>
      <div id="d-a3" class="ancla"><div class="rot mono et" id="d-w3">tal</div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>

  </div>
  <script>
    const root = document.querySelector('[data-composition-id="datos"]');
    const tl = gsap.timeline({ paused: true });
    const ent = (id, t, d = 0.25) => { tl.fromTo(id, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: d, ease: 'power3.out' }, t); };
    const sal = (id, t) => { tl.to(id, { opacity: 0, duration: 0.2 }, t); };
    ent('#d-w1', 2.6); ent('#d-w2', 2.75); ent('#d-w3', 2.9);
    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), T = Tm.T3(E), { V, P, clamp, EASE } = E;
      const pop = (o, t, t0, d = 0.35, s = 1) => { const q = EASE.out(clamp((t - t0) / d)); o.scale.setScalar(Math.max(0.001, s * q)); o.visible = q > 0.002; };
      const quitar = (o, t, t0, d = 0.3, s = 1) => { const q = 1 - EASE.in(clamp((t - t0) / d)); o.scale.setScalar(Math.max(0.001, s * q)); o.visible = q > 0.002; };
      const onda = T.onda(0.9, 0.11); onda.position.set(0, 1.0, 0); E.scene.add(onda);
      const mu = T.fila(['0.1', '0.6', '0.9', '0.4', '-0.3', '-0.8', '-0.5', '0.2', '0.7', '0.3'], 0.078, 0.088); mu.position.set(0, 0.8, 0); E.scene.add(mu);
      const W = [['0.2', '-0.7', '0.5', '0.1'], ['0.9', '0.3', '-0.4', '0.6'], ['-0.2', '0.8', '0.1', '-0.5']], fil = W.map((w, i) => { const f = T.fila(w, 0.078, 0.088); f.position.set(0.12, 0.5 - i * 0.1, 0); E.scene.add(f); return f; });
      E.animar(tl, 5.7, (t) => {
        E.ruta(t, [{ t: 0, p: [0.35, 0.7, 3.3], l: [0, 0.58, 0] }, { t: 5.7, p: [0.1, 0.66, 3.05], l: [0, 0.58, 0], e: 'out' }]);
        onda.userData.set(clamp((t - 0.3) / 0.9)); mu.userData.set(clamp((t - 1.2) / 1.0));
        fil.forEach((f, i) => f.userData.set(clamp((t - 3.6 - 0.2 * i) / 0.7)));
        [1, 2, 3].forEach((i) => E.label(root.querySelector('#d-a' + i), new V(-0.33, 0.5 - (i - 1) * 0.1, 0)));
      });
      window.__timelines['datos'] = tl;
    });
  </script>
</template>
