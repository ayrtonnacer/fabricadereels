<!-- FOTO (10,4 s) — foto en blanco y negro = cuadrícula (planilla) = matriz; en color son 3 cuadrículas apiladas: un cubo de números = tensor. -->
<template>
  <style>#root { position: absolute; inset: 0; } .et { opacity: 0; } #root .w { display: inline-block; } </style>
  <div id="root" data-composition-id="foto" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="f-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore>

    </div>
    <div class="vineta" data-layout-ignore></div>

  </div>
  <script>
    const root = document.querySelector('[data-composition-id="foto"]');
    const tl = gsap.timeline({ paused: true });
    const ent = (id, t, d = 0.25) => { tl.fromTo(id, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: d, ease: 'power3.out' }, t); };
    const sal = (id, t) => { tl.to(id, { opacity: 0, duration: 0.2 }, t); };

    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), T = Tm.T3(E), { V, P, clamp, EASE } = E;
      const pop = (o, t, t0, d = 0.35, s = 1) => { const q = EASE.out(clamp((t - t0) / d)); o.scale.setScalar(Math.max(0.001, s * q)); o.visible = q > 0.002; };
      const quitar = (o, t, t0, d = 0.3, s = 1) => { const q = 1 - EASE.in(clamp((t - t0) / d)); o.scale.setScalar(Math.max(0.001, s * q)); o.visible = q > 0.002; };
      const foto = T.foto({ S: 0.9 }); foto.position.set(0, 0.55, 0); E.scene.add(foto); foto.userData.mix(1);
      const cap = T.capas({ S: 0.9, sep: 0.2 }); cap.position.set(0, 0.55, 0); E.scene.add(cap);
      const cubo = T.caja(0.98, 0.98, 0.5, P.acc, 3); cubo.position.set(0, 0.55, -0.2); E.scene.add(cubo);
      const cy = 0.55 + 0.45 - 8.5 / 16 * 0.9;
      E.animar(tl, 10.4, (t) => {
        E.ruta(t, [{ t: 0, p: [0, cy + 0.03, 1.9], l: [0, cy, 0] }, { t: 1.4, p: [0, 0.5, 3.6], l: [0, 0.42, 0], e: 'io' }, { t: 5.2, p: [0.15, 0.52, 3.5], l: [0, 0.42, 0], e: 'lin' },
          { t: 6.9, p: [2.6, 0.92, 3.9], l: [0, 0.58, -0.2], e: 'io' }, { t: 10.4, p: [2.65, 0.93, 3.75], l: [0, 0.58, -0.2], e: 'lin' }]);
        const m = 1 - EASE.io(clamp((t - 0.5) / 0.6)) + EASE.io(clamp((t - 2.0) / 0.6)); foto.userData.mix(clamp(m));
        foto.visible = t < 5.35; cap.visible = t >= 5.3; cap.userData.set(clamp((t - 5.8) / 1.0));
        cubo.userData.set(clamp((t - 7.4) / 0.4));
      });
      window.__timelines['foto'] = tl;
    });
  </script>
</template>
