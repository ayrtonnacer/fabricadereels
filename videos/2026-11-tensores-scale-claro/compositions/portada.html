  <style>#root { position: absolute; inset: 0; } .et { opacity: 0; } #root .w { display: inline-block; } #p-firma { position: absolute; left: 0; right: 0; top: 205px; text-align: center; }</style>

    <canvas id="c-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore>
      <div class="ancla" style="top: 470px"><h1 id="c-tit" class="titular" style="width: 980px; text-align: center;">¿Qué es un <span class="acc">tensor</span>?</h1></div>

    <div class="vineta" data-layout-ignore></div>

  <script>
    const root = document.querySelector('[data-composition-id="portada"]');
    const tl = gsap.timeline({ paused: true });
    const ent = (id, t, d = 0.25) => { tl.fromTo(id, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: d, ease: 'power3.out' }, t); };
    const sal = (id, t) => { tl.to(id, { opacity: 0, duration: 0.2 }, t); };

    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), T = Tm.T3(E), { V, P, clamp, EASE } = E;
      const pop = (o, t, t0, d = 0.35, s = 1) => { const q = EASE.out(clamp((t - t0) / d)); o.scale.setScalar(Math.max(0.001, s * q)); o.visible = q > 0.002; };
      const quitar = (o, t, t0, d = 0.3, s = 1) => { const q = 1 - EASE.in(clamp((t - t0) / d)); o.scale.setScalar(Math.max(0.001, s * q)); o.visible = q > 0.002; };
      const cap = T.capas({ S: 0.7, sep: 0.15 }); cap.position.set(0, 0.5, 0); E.scene.add(cap);
      const cubo = T.caja(0.76, 0.76, 0.38, P.acc, 3); cubo.position.set(0, 0.5, -0.15); cubo.userData.set(1); E.scene.add(cubo);
      E.animar(tl, 0.1, () => E.ruta(0, [{ t: 0, p: [2.4, 0.9, 3.6], l: [0, 0.55, -0.15] }, { t: 1, p: [2.4, 0.9, 3.6], l: [0, 0.55, -0.15] }]));
      window.__timelines['portada'] = tl;
    });
  </script>
