<!-- ETHERNET (4,6 s) — 3D. Detalle de profesional: para la red, el WiFi es Ethernet sin cable. El cable se corta, el tramo pasa a
     ondas y los paquetes son los mismos. La cámara se acerca a la línea durante el cambio. Texto HTML sobre el 3D. -->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #e-titulo { width: 960px; text-align: center; }
    #e-tag, #e-tag2 { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  </style>
  <div id="root" data-composition-id="ethernet" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="e-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore>
      <div class="ancla" style="top: 340px"><h2 id="e-titulo" class="titular chico"><span class="w">WiFi</span> <span class="w">es</span> <span class="w">Ethernet</span><br /><span class="w acc">sin</span> <span class="w acc">cable</span></h2></div>
      <div id="e-lb" class="ancla" style="width: 0; height: 0"><div id="e-tag" class="chip">Ethernet</div><div id="e-tag2" class="chip" style="border-color: var(--acc); color: var(--acc)">WiFi</div></div>
      <div class="ancla" style="top: 930px"><div id="e-mismos" class="chip ok"><b>✓</b> mismos paquetes</div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="ethernet"]');
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#e-titulo .w', { opacity: 0.4, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out', stagger: 0.06 }, 0);
    tl.set('#e-tag2', { opacity: 0 }, 0);
    tl.to('#e-tag', { opacity: 0, duration: 0.15 }, 2.2);
    tl.fromTo('#e-tag2', { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.4);
    tl.fromTo('#e-mismos', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, 3.2);
    import('./assets/escena3d.js').then(async (M) => {
      const E = await M.crear(root), { P, V, clamp, EASE } = E;
      const lap = E.laptop(); lap.position.set(-0.22, 0, 0.5); lap.rotation.y = 0.45; E.scene.add(lap);
      const rt = E.router(); rt.position.set(0.42, 0, -0.6); rt.rotation.y = -0.45; E.scene.add(rt);
      E.scene.updateMatrixWorld(true);
      // el cable va de un puerto a otro (toca los dos objetos); la señal de radio no necesita encajar justo: de la tapa a la antena
      const A = lap.localToWorld(new V(0.17, 0.012, 0.02)), B = rt.localToWorld(rt.userData.puertoLado.clone());
      const cab = E.cable(A, B), O = lap.localToWorld(lap.userData.emisor.clone()), Q = rt.localToWorld(rt.userData.puntaAntena.clone());
      const anillos = [0, 1, 2].map(() => E.anillo(P.acc, new V(0, 1, 0), 0.014));   // el cable se vuelve aire: anillos de radio desde la notebook
      const mid = A.clone().lerp(B, 0.5);
      const pk = [0, 1, 2, 3, 4, 5].map(() => { const m = E.paquete(P.acc, 0.04); m.visible = false; E.scene.add(m); return m; });
      E.animar(tl, 4.6, (t) => {
        E.ruta(t, [
          { t: 0, p: [-0.3, 1.1, 4.2], l: [0, 0.1, -0.05] },
          { t: 0.9, p: [0.1, 1.0, 3.5], l: [0, 0.1, -0.05], e: 'expo' },
          { t: 1.7, p: [0.1, 1.0, 3.5], l: [0, 0.1, -0.05], e: 'lin' },
          { t: 3.0, p: [-0.05, 0.75, 3.1], l: [0.02, 0.08, -0.05], e: 'io' },
          { t: 4.6, p: [0.5, 0.9, 3.1], l: [0, 0.1, -0.05], e: 'io' }]);
        cab.set(t < 2.0 ? EASE.out(clamp((t - 0.6) / 0.5)) : 1 - EASE.in(clamp((t - 2.0) / 0.5)));
        anillos.forEach((r, i) => r.emitir((t - (2.3 + 0.35 * i)) / 1.2, 1.3, new V(O.x, 0.02, O.z)));
        pk.forEach((m, i) => { const t0 = i < 3 ? 1.0 + 0.3 * i : 2.5 + 0.3 * (i - 3), p = (t - t0) / 0.9; m.visible = p > 0 && p < 1; if (m.visible) { if (t < 2.4) m.position.lerpVectors(A, B, p); else m.position.lerpVectors(O, Q, p); } });   // por el cable… y luego por el aire: los mismos paquetes
        E.label(root.querySelector('#e-lb'), mid.clone().add(new V(0, 0.16, 0)));
      });
      window.__timelines['ethernet'] = tl;
    });
  </script>
</template>
