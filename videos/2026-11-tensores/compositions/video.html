<!-- VIDEO (8,4 s) — un video suma el tiempo: cubos (cuadros en color) uno detrás de otro con un cursor de tiempo. Después, todo el recorrido en un plano: 0D, 1D, 2D, 3D y 4D. -->
<template>
  <style>#root { position: absolute; inset: 0; } .et { opacity: 0; } #root .w { display: inline-block; } </style>
  <div id="root" data-composition-id="video" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="v-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore>
      <div id="v-at" class="ancla"><div class="rot et" id="v-et">tiempo</div></div>
      <div id="v-a0" class="ancla"><div class="rot et" id="v-e0">0D</div></div>
      <div id="v-a1" class="ancla"><div class="rot et" id="v-e1">1D</div></div>
      <div id="v-a2" class="ancla"><div class="rot et" id="v-e2">2D</div></div>
      <div id="v-a3" class="ancla"><div class="rot et" id="v-e3">3D</div></div>
      <div id="v-a4" class="ancla"><div class="rot et" id="v-e4">4D</div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>

  </div>
  <script>
    const root = document.querySelector('[data-composition-id="video"]');
    const tl = gsap.timeline({ paused: true });
    const ent = (id, t, d = 0.25) => { tl.fromTo(id, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: d, ease: 'power3.out' }, t); };
    const sal = (id, t) => { tl.to(id, { opacity: 0, duration: 0.2 }, t); };
    ent('#v-et', 1.2); sal('#v-et', 3.5);
    [0, 1, 2, 3, 4].forEach((i) => ent('#v-e' + i, 4.2 + 0.3 * i));
    tl.to('#v-root-acc', {}, 0);
    tl.to(['#v-e0', '#v-e1', '#v-e2', '#v-e3', '#v-e4'], { color: getComputedStyle(document.documentElement).getPropertyValue('--acc').trim(), duration: 0.3, stagger: 0.08 }, 6.1);
    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), T = Tm.T3(E), { V, P, clamp, EASE } = E;
      const pop = (o, t, t0, d = 0.35, s = 1) => { const q = EASE.out(clamp((t - t0) / d)); o.scale.setScalar(Math.max(0.001, s * q)); o.visible = q > 0.002; };
      const quitar = (o, t, t0, d = 0.3, s = 1) => { const q = 1 - EASE.in(clamp((t - t0) / d)); o.scale.setScalar(Math.max(0.001, s * q)); o.visible = q > 0.002; };
      const XV = 1.1, sols = [0.18, 0.33, 0.48, 0.63], fr = sols.map((s, i) => { const c = T.capas({ S: 0.38, sol: s, sep: 0.06 }); c.position.set(XV, 0.25, -i * 0.7); E.scene.add(c); return c; });
      const eje = E.trazo([new V(XV + 0.32, 0.01, 0.4), new V(XV + 0.32, 0.01, -2.6)], P.acc, 3); E.scene.add(eje);
      const cur = new E.THREE.Mesh(new E.THREE.SphereGeometry(0.03, 16, 12), E.basic(P.acc)); E.scene.add(cur);
      const esc = T.celda('128', 0.13, P.edge, 128 / 255); esc.position.set(-1.1, 0.3, 0); E.scene.add(esc);
      const vec = T.fila(['92', '98', '128', '140'], 0.1, 0.11); vec.position.set(-0.68, 0.3, 0); E.scene.add(vec);
      const mat = T.foto({ S: 0.42 }); mat.userData.mix(1); mat.position.set(-0.05, 0.3, 0); E.scene.add(mat);
      const cub = T.capas({ S: 0.38, sep: 0.08 }); cub.position.set(0.55, 0.28, 0); E.scene.add(cub);
      const L = (i) => root.querySelector('#v-a' + i);
      E.animar(tl, 8.4, (t) => {
        E.ruta(t, [{ t: 0, p: [3.0, 0.95, 2.3], l: [XV, 0.25, -1.1] }, { t: 3.3, p: [2.9, 0.95, 2.0], l: [XV, 0.25, -1.1], e: 'lin' }, { t: 4.6, p: [0, 1.3, 7.2], l: [0, 0.3, -0.7], e: 'io' }, { t: 8.4, p: [0, 1.25, 6.9], l: [0, 0.3, -0.7], e: 'lin' }]);
        const u = clamp((t - 0.6) / 2.4); cur.position.set(XV + 0.32, 0.04, 0.3 - 2.6 * u); cur.visible = t < 3.6;
        pop(esc, t, 4.2); vec.userData.set(clamp((t - 4.5) / 0.5)); pop(mat, t, 4.8); pop(cub, t, 5.1);
        E.label(L(0), new V(-1.1, 0.55, 0)); E.label(L(1), new V(-0.68, 0.55, 0)); E.label(L(2), new V(-0.05, 0.62, 0)); E.label(L(3), new V(0.55, 0.6, 0)); E.label(L(4), new V(XV, 0.6, -1.0));
        E.label(root.querySelector('#v-at'), new V(XV + 0.32, 0.15, -0.9));
      });
      window.__timelines['video'] = tl;
    });
  </script>
</template>
