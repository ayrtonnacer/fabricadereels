<!-- TIPOS (13,2 s) — la cara se vuelve números (la IA no ve: multiplica números) y se encoge hasta un escalar; después la cámara viaja por el eje z:
     escalar (0 ejes) → vector (1 eje) → matriz (2 ejes). Un objeto por concepto, cada uno aparece cuando la voz lo nombra. -->
<template>
  <style>#root { position: absolute; inset: 0; } .et { opacity: 0; }</style>
  <div id="root" data-composition-id="tipos" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="t-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore>
      <div id="t-a1" class="ancla"><div class="rot et" id="t-e1"><b>0</b> ejes</div></div>
      <div id="t-a2" class="ancla"><div class="rot et" id="t-e2"><b>1</b> eje</div></div>
      <div id="t-a3" class="ancla"><div class="rot et" id="t-e3"><b>2</b> ejes</div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="tipos"]');
    const tl = gsap.timeline({ paused: true });
    const ent = (id, t) => { tl.fromTo(id, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.25, ease: 'power3.out' }, t); };
    const sal = (id, t) => { tl.to(id, { opacity: 0, duration: 0.25 }, t); };
    ent('#t-e1', 4.0); sal('#t-e1', 6.2); ent('#t-e2', 7.4); sal('#t-e2', 9.7); ent('#t-e3', 11.0);
    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), T = Tm.T3(E), { V, clamp, EASE } = E;
      const f = T.foto(); f.position.set(0, 0.55, 0); E.scene.add(f);
      const esc = T.celda('8.4', 0.3); esc.position.set(0, 0.55, 0); E.scene.add(esc);
      const vec = T.bloque([[2, -3, 1.5, 4]], 0.14, 0.16); vec.position.set(0, 0.55, -2.2); E.scene.add(vec);
      const mat = T.bloque([[0.2, -1, 0.5, 0.8], [1.5, 0.3, -0.7, 0.1], [-0.4, 0.9, 0.6, -1.2]], 0.14, 0.16); mat.position.set(0, 0.55, -4.4); E.scene.add(mat);
      const A1 = root.querySelector('#t-a1'), A2 = root.querySelector('#t-a2'), A3 = root.querySelector('#t-a3');
      E.animar(tl, 13.2, (t) => {
        E.ruta(t, [
          { t: 0, p: [0, 0.5, 3.3], l: [0, 0.45, 0] },
          { t: 2.3, p: [0, 0.5, 3.3], l: [0, 0.45, 0], e: 'lin' },
          { t: 3.1, p: [0, 0.62, 1.45], l: [0, 0.55, 0], e: 'out' },
          { t: 6.2, p: [0, 0.62, 1.45], l: [0, 0.55, 0], e: 'lin' },
          { t: 7.4, p: [0, 0.62, -0.35], l: [0, 0.55, -2.2], e: 'io' },
          { t: 9.7, p: [0, 0.62, -0.35], l: [0, 0.55, -2.2], e: 'lin' },
          { t: 11.0, p: [0, 0.62, -2.5], l: [0, 0.55, -4.4], e: 'io' },
          { t: 13.2, p: [0, 0.62, -2.75], l: [0, 0.55, -4.4], e: 'lin' }]);
        f.userData.mix(EASE.io(clamp((t - 0.8) / 1.2)));
        const sf = 1 - EASE.in(clamp((t - 2.3) / 0.6)); f.scale.setScalar(Math.max(0.001, sf)); f.visible = sf > 0.002;
        const se = EASE.out(clamp((t - 2.9) / 0.35)); esc.scale.setScalar(Math.max(0.001, se)); esc.visible = se > 0.002;
        vec.userData.set(clamp((t - 7.0) / 0.8)); mat.userData.set(clamp((t - 10.6) / 1.0));
        E.label(A1, new V(0, 0.76, 0)); E.label(A2, new V(0, 0.68, -2.2)); E.label(A3, new V(0, 0.86, -4.4));
      });
      window.__timelines['tipos'] = tl;
    });
  </script>
</template>
