<!-- PAYOFF (4 s) — cierra el gancho: la cara = 3 ejes (alto, ancho, canales); un lote de caras = 4 ejes. -->
<template>
  <style>#root { position: absolute; inset: 0; } .et { opacity: 0; }</style>
  <div id="root" data-composition-id="payoff" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="p-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore>
      <div id="p-a1" class="ancla"><div class="rot et" id="p-e1">alto</div></div>
      <div id="p-a2" class="ancla"><div class="rot et" id="p-e2">ancho</div></div>
      <div id="p-a3" class="ancla"><div class="rot et" id="p-e3">canales</div></div>
      <div id="p-a4" class="ancla"><div class="rot et" id="p-e4"><b>lote</b></div></div>
      <div class="ancla" style="top: 420px"><div class="rot mono et" id="p-e5"><b>lote</b> · canales · alto · ancho</div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="payoff"]');
    const tl = gsap.timeline({ paused: true });
    const sal = (id, t) => { tl.to(id, { opacity: 0, duration: 0.2 }, t); };
    const ent = (id, t) => { tl.fromTo(id, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power3.out' }, t); };
    ent('#p-e1', 0.75); ent('#p-e2', 0.95); ent('#p-e3', 1.15); sal('#p-e1', 1.75); sal('#p-e2', 1.75); sal('#p-e3', 1.75); ent('#p-e4', 2.4); ent('#p-e5', 2.44);
    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), T = Tm.T3(E), { V, clamp, EASE } = E;
      const pila = T.pila(3, 0.16, 8, 0.075); pila.position.set(0, 0.55, 0); E.scene.add(pila);
      const copias = [-0.9, -0.45, 0.45, 0.9].map((x) => { const c = T.copiar(pila); c.position.set(x, 0.55 * 0.55, 0); c.scale.setScalar(0.001); E.scene.add(c); return c; });
      pila.userData.set(0);
      const ejes = [T.eje(new V(-0.4, 0.235, 0), new V(-0.4, 0.865, 0)), T.eje(new V(-0.315, 0.93, 0), new V(0.315, 0.93, 0)), T.eje(new V(0.4, 0.93, 0), new V(0.4, 0.93, -0.37))];
      const lote = T.eje(new V(-1.0, 0.1, 0), new V(1.0, 0.1, 0), E.P.acc, 4);
      const L = (i) => root.querySelector('#p-a' + i);
      E.animar(tl, 4.0, (t) => {
        E.ruta(t, [
          { t: 0, p: [0, 0.6, 2.6], l: [0, 0.35, 0] },
          { t: 0.5, p: [0, 0.6, 2.6], l: [0, 0.35, 0], e: 'lin' },
          { t: 1.3, p: [1.5, 0.75, 3.0], l: [0, 0.35, -0.15], e: 'io' },
          { t: 1.6, p: [1.5, 0.75, 3.0], l: [0, 0.35, -0.15], e: 'lin' },
          { t: 2.6, p: [0, 1.0, 5.4], l: [0, 0.35, 0], e: 'io' },
          { t: 4.0, p: [0, 1.0, 5.3], l: [0, 0.35, 0], e: 'lin' }]);
        pila.userData.set(clamp((t - 0.45) / 0.6));
        const k = EASE.io(clamp((t - 1.6) / 0.8)), s = 1 - 0.45 * k; pila.scale.setScalar(s); pila.position.y = 0.55 * s;
        copias.forEach((c, i) => { const q = EASE.out(clamp((t - 1.8 - 0.1 * i) / 0.3)); c.scale.setScalar(Math.max(0.001, 0.55 * q)); c.visible = q > 0.002; });
        ejes.forEach((e, i) => e.userData.set(clamp((t - (0.75 + 0.2 * i)) / 0.25) * (1 - clamp((t - 1.7) / 0.2))));
        lote.userData.set(EASE.out(clamp((t - 2.3) / 0.6)));
        E.label(L(1), new V(-0.5, 0.55, 0)); E.label(L(2), new V(0, 1.0, 0)); E.label(L(3), new V(0.5, 0.99, -0.3)); E.label(L(4), new V(0, -0.03, 0));
      });
      window.__timelines['payoff'] = tl;
    });
  </script>
</template>
