<!-- TENSOR (9,8 s) — una foto en color = 3 ejes (alto, ancho, canales): la cámara orbita y se ven las capas; después se apilan 32 fotos y aparece el 4.º eje (lote). -->
<template>
  <style>#root { position: absolute; inset: 0; } .et { opacity: 0; }</style>
  <div id="root" data-composition-id="tensor" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="n-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore>
      <div id="n-a1" class="ancla"><div class="rot et" id="n-e1">alto</div></div>
      <div id="n-a2" class="ancla"><div class="rot et" id="n-e2">ancho</div></div>
      <div id="n-a3" class="ancla"><div class="rot et" id="n-e3">canales</div></div>
      <div id="n-a4" class="ancla"><div class="rot et" id="n-e4"><b>×</b> 32</div></div>
      <div id="n-a5" class="ancla"><div class="rot et" id="n-e5"><b>lote</b></div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="tensor"]');
    const tl = gsap.timeline({ paused: true });
    const ent = (id, t) => { tl.fromTo(id, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.25, ease: 'power3.out' }, t); };
    const sal = (id, t) => { tl.to(id, { opacity: 0, duration: 0.2 }, t); };
    ent('#n-e1', 3.32); ent('#n-e2', 3.8); ent('#n-e3', 4.19); sal('#n-e1', 5.5); sal('#n-e2', 5.5); sal('#n-e3', 5.5);
    ent('#n-e4', 6.4); ent('#n-e5', 8.6);
    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), T = Tm.T3(E), { V, clamp, EASE } = E;
      const pila = T.pila(3, 0.16, 8, 0.075); pila.position.set(0, 0.55, 0); E.scene.add(pila);
      const copias = [-0.9, -0.45, 0.45, 0.9].map((x) => { const c = T.copiar(pila); c.position.set(x, 0.55 * 0.55, 0); c.scale.setScalar(0.001); E.scene.add(c); return c; });
      pila.userData.set(0);
      const ejes = [
        { e: T.eje(new V(-0.4, 0.235, 0), new V(-0.4, 0.865, 0)), t: 3.32 },
        { e: T.eje(new V(-0.315, 0.93, 0), new V(0.315, 0.93, 0)), t: 3.8 },
        { e: T.eje(new V(0.4, 0.93, 0), new V(0.4, 0.93, -0.37)), t: 4.19 }];
      const lote = T.eje(new V(-1.0, 0.1, 0), new V(1.0, 0.1, 0), P_ACC(E), 4);
      function P_ACC(E) { return E.P.acc; }
      const L = (i) => root.querySelector('#n-a' + i);
      E.animar(tl, 9.8, (t) => {
        E.ruta(t, [
          { t: 0, p: [0, 0.6, 2.6], l: [0, 0.35, 0] },
          { t: 1.8, p: [0, 0.6, 2.6], l: [0, 0.35, 0], e: 'lin' },
          { t: 3.3, p: [1.5, 0.75, 3.0], l: [0, 0.35, -0.15], e: 'io' },
          { t: 5.5, p: [1.6, 0.78, 3.1], l: [0, 0.35, -0.15], e: 'lin' },
          { t: 7.0, p: [0, 1.0, 5.4], l: [0, 0.35, 0], e: 'io' },
          { t: 9.8, p: [0, 1.0, 5.2], l: [0, 0.35, 0], e: 'lin' }]);
        pila.userData.set(clamp((t - 2.4) / 0.9));
        const k = EASE.io(clamp((t - 5.6) / 0.8)), s = 1 - 0.45 * k;
        pila.scale.setScalar(s); pila.position.y = 0.55 * s;
        copias.forEach((c, i) => { const q = EASE.out(clamp((t - 6.0 - 0.18 * i) / 0.4)); c.scale.setScalar(Math.max(0.001, 0.55 * q)); c.visible = q > 0.002; });
        ejes.forEach((o) => o.e.userData.set(clamp((t - o.t) / 0.3) * (1 - clamp((t - 5.5) / 0.2))));
        lote.userData.set(EASE.out(clamp((t - 7.7) / 0.8)));
        E.label(L(1), new V(-0.5, 0.55, 0)); E.label(L(2), new V(0, 1.0, 0)); E.label(L(3), new V(0.5, 0.99, -0.3));
        E.label(L(4), new V(0, 0.95, 0)); E.label(L(5), new V(0, -0.03, 0));
      });
      window.__timelines['tensor'] = tl;
    });
  </script>
</template>
