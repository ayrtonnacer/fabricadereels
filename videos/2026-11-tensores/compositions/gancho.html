    const root = document.querySelector('[data-composition-id="gancho"]');
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#g-titular .w', { opacity: 0.9, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out', stagger: 0.12 }, 0.1);
    tl.fromTo('#g-firma', { opacity: 0.6 }, { opacity: 1, duration: 0.25 }, 0);

    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), T = Tm.T3(E);

      E.animar(tl, 3.0, (t) => {
        E.ruta(t, [
          { t: 0, p: [0.9, 0.8, 4.2], l: [0, 0.45, 0] },
          { t: 1.3, p: [0.2, 0.55, 3.5], l: [0, 0.45, 0], e: 'expo' },
          { t: 3.0, p: [0, 0.5, 3.3], l: [0, 0.45, 0], e: 'io' }]);
      });
      window.__timelines['gancho'] = tl;
    });
