<!-- RED (5,2 s) — "para qué sirve": entrada y pesos son tensores; el tensor de entrada cruza la capa de pesos (cámara siguiéndolo en z) y sale transformado. -->
<template>
  <style>#root { position: absolute; inset: 0; } .et { opacity: 0; }</style>
  <div id="root" data-composition-id="red" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="r-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore>
      <div id="r-a1" class="ancla"><div class="rot et" id="r-e1">entrada</div></div>
      <div id="r-a2" class="ancla"><div class="rot et" id="r-e2">pesos</div></div>
      <div id="r-a3" class="ancla"><div class="rot et" id="r-e3">salida</div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="red"]');
    const tl = gsap.timeline({ paused: true });
    const ent = (id, t) => { tl.fromTo(id, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.25, ease: 'power3.out' }, t); };
    ent('#r-e1', 1.1); ent('#r-e2', 1.7); ent('#r-e3', 4.1);
    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), T = Tm.T3(E), { V, clamp, EASE } = E;
      const ent3 = T.pila(3, 0.12, 8, 0.05); ent3.position.set(0, 0.4, 0.4); E.scene.add(ent3);
      const peso = T.bloque([[0.2, -1, 0.5], [1.5, 0.3, -0.7], [-0.4, 0.9, 0.6], [0.8, -0.2, 1.1]], 0.12, 0.14, E.P.acc); peso.position.set(0, 0.5, -0.9); E.scene.add(peso);
      const sal = T.bloque([[0.7, 1.3, -0.4]], 0.12, 0.14); sal.position.set(0, 0.4, -2.3); sal.scale.setScalar(1.5); E.scene.add(sal);
      const L = (i) => root.querySelector('#r-a' + i);
      E.animar(tl, 5.2, (t) => {
        E.ruta(t, [
          { t: 0, p: [0.9, 0.85, 3.0], l: [0, 0.45, -0.6] },
          { t: 2.9, p: [0.9, 0.85, 2.9], l: [0, 0.45, -0.7], e: 'out' },
          { t: 4.4, p: [0.9, 0.8, 1.0], l: [0, 0.4, -1.5], e: 'io' },
          { t: 5.2, p: [0.9, 0.8, 0.9], l: [0, 0.4, -1.5], e: 'lin' }]);
        const a = EASE.out(clamp((t - 0.7) / 0.5)); ent3.scale.setScalar(Math.max(0.001, a));
        peso.userData.set(clamp((t - 1.5) / 0.9));
        const m = EASE.io(clamp((t - 3.0) / 1.2)); ent3.position.z = 0.4 - 1.5 * m;
        const sq = 1 - EASE.in(clamp((t - 3.6) / 0.6)); ent3.scale.set(Math.max(0.001, a * (1 - 0.6 * m) * sq), Math.max(0.001, a * (1 - 0.2 * m) * sq), Math.max(0.001, a * sq)); ent3.visible = a > 0.002 && sq > 0.004;
        sal.userData.set(clamp((t - 3.9) / 0.7));
        E.label(L(1), new V(0, 0.72, 0.4)); E.label(L(2), new V(0, 0.95, -0.9)); E.label(L(3), new V(0, 0.62, -2.3));
      });
      window.__timelines['red'] = tl;
    });
  </script>
</template>
