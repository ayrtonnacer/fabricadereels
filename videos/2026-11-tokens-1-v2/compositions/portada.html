      const punto = new THREE.Mesh(new THREE.SphereGeometry(0.03, 20, 14), E.basic(P.acc)); const f0 = fs[0]; punto.position.set(f0.position.x + f0.userData.w / 2, f0.position.y + f0.userData.h / 2, f0.position.z + 0.04); E.scene.add(punto);
      E.animar(tl, 0.1, () => E.ruta(0, [{ t: 0, p: [1.5, 1.35, 3.1], l: [0.12, 1.0, -0.4] }, { t: 1, p: [1.5, 1.35, 3.1], l: [0.12, 1.0, -0.4] }]));
