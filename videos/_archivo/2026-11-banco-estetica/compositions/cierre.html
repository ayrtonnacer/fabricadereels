<!-- CIERRE / CTA: el foco es el llamado (el texto coincide con la voz); la firma aparece después, chica, debajo. La cámara aterriza y queda quieta. -->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .w { display: inline-block; }
    #c-cta { width: 1000px; font-size: 100px; text-align: center; }
    #c-firma { font-size: 58px; }
  </style>
  <div id="root" data-composition-id="cierre" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="c-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div id="c-velo" data-layout-ignore style="position:absolute; inset:0; background:#000; opacity:0; pointer-events:none"></div>
    <div class="hud" data-layout-ignore>
      <div class="ancla" style="top: 600px"><h2 id="c-cta" class="titular">
        <span class="w">Dale</span> <span class="w acc">like</span> <span class="w">y</span><br />
        <span class="w">seguime</span> <span class="w">para</span><br />
        <span class="w">aprender</span> <span class="w">más</span> <span class="w">sobre</span><br />
        <span class="w acc">inteligencia</span> <span class="w acc">artificial</span></h2></div>
      <div class="ancla" style="top: 1030px"><div id="c-firma" class="firma">@ayrtonnacer</div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="cierre"]');
    const tl = gsap.timeline({ paused: true });
    const ws = document.querySelectorAll('#c-cta .w'), T = [0.65, 0.87, 1.25, 1.34, 1.66, 1.8, 2.2, 2.38, 2.63, 3.18];   // cada palabra cuando la dice la voz
    ws.forEach((w, i) => tl.fromTo(w, { opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out' }, T[i] - 0.05));
    if ((window.NIVEL || 0) >= 1) tl.fromTo('#c-velo', { opacity: 0 }, { opacity: 0.78, duration: 0.5, ease: 'power2.out' }, 0.45);   // penumbra: el bloque queda de fondo cuando entra el CTA
    tl.fromTo('#c-firma', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 3.8);
    Promise.all([import('./assets/escena3d.js'), import('./assets/tensor3d.js')]).then(async ([M, Tm]) => {
      const E = await M.crear(root), N = window.NIVEL || 0;
      // N≥1 encuadre: el bloque de números (el tema del reel) vuelve detrás del CTA, atrás y en penumbra: llena el cuadro sin competir con el llamado
      if (N >= 1) { const T = Tm.T3(E), g = new E.THREE.Group(), cap = T.capas({ S: 0.9, sep: 0.2 }), cubo = T.caja(0.98, 0.98, 0.5, E.P.acc, 3); cubo.position.z = -0.2; cubo.userData.set(1); g.add(cap, cubo);
        g.position.set(0, 0.62, -1.6); g.rotation.y = -0.5; E.scene.add(g); E.bloque = g; E.foco = () => 1.2;   /* N≥3: foco en el plano del CTA; el bloque queda desenfocado atrás */ if (E.LUZ) { const h = E.halo(1.7, 0.15); h.position.set(-0.3, 1.0, -2.6); E.scene.add(h); } }
      const RUTA = N >= 4 ? [{ t: 0, p: [0, 2.2, 6.4], l: [0, 0.4, -1.4] }, { t: 1.1, p: [0, 1.0, 2.6], l: [0, 0.75, -1.4], e: 'expo' }, { t: 5.0, p: [0, 0.99, 2.55], l: [0, 0.75, -1.4], e: 'lin' }] : N >= 1 ? [{ t: 0, p: [0, 3.4, 5.6], l: [0, 0.2, -1.4] }, { t: 1.2, p: [0, 1.0, 2.6], l: [0, 0.75, -1.4], e: 'expo' }, { t: 5.0, p: [0, 0.98, 2.45], l: [0, 0.75, -1.4], e: 'lin' }]
        : [{ t: 0, p: [0, 3.4, 5.6], l: [0, 0.2, -0.5] }, { t: 1.2, p: [0, 1.1, 3.2], l: [0, 0.6, -0.5], e: 'expo' }, { t: 5.0, p: [0, 1.0, 3.0], l: [0, 0.6, -0.5], e: 'lin' }];
      E.animar(tl, 5.0, (t) => { E.ruta(t, RUTA); if (E.bloque) E.bloque.rotation.y = -0.5 + 0.06 * t; });
      window.__timelines['cierre'] = tl;
    });
  </script>
</template>
