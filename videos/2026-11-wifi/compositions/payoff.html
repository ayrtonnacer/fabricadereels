<!-- PAYOFF (3,9 s): departamento en 3D real (three.js): el router abajo, la pared al medio, el cuarto lejano arriba.
     Anillos de onda en el piso: los de 5 GHz se frenan antes de la pared; los de 2,4 GHz la cruzan y llegan al teléfono lejano.
     Piloto de three.js: costo medido ≈ +1 s de render por segundo de video (docs/CAMARA.md). El texto y los chips siguen siendo HTML. -->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #y-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="payoff" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="y-cv" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="vista" data-layout-allow-overflow>
      <div class="cam"><div class="mundo">
        <div id="y-c1" class="chip ok" data-x="-235" data-y="-560" data-z="140"><b>✓</b> Cerca: 5 GHz</div>
        <div id="y-c2" class="chip ok" data-x="245" data-y="-560" data-z="140" style="border-color: var(--acc)"><b>✓</b> Lejos: 2,4 GHz</div>
      </div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="payoff"]');
    const tl = gsap.timeline({ paused: true });
    const cam2d = Camara(root, tl);
    cam2d.poner({ z: 0 });
    tl.fromTo('#y-c1', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, 1.5);
    tl.fromTo('#y-c2', { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, 2.1);

    // ---- escena 3D (todo función del tiempo local t) ----
    import('./assets/three.module.js').then((THREE) => {
      const css = (v, d) => (getComputedStyle(document.documentElement).getPropertyValue(v).trim() || d);
      const col = (v, d) => new THREE.Color(css(v, d));
      const renderer = new THREE.WebGLRenderer({ canvas: root.querySelector('#y-cv'), antialias: true, alpha: true });
      renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false); renderer.setClearColor(0x000000, 0);
      const scene = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(42, 1080 / 1920, 0.1, 60);
      scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x1a2638, 2.0));
      const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(2, 6, 4); scene.add(sun);
      const std = (c, r = 0.55, m = 0.15) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
      const LINE = col('--line', '#24344B'), ACC = col('--acc', '#9FEF00'), SKY = col('--sky', '#3BC9FF'), TXT = col('--text', '#E8EEF7');

      // piso del departamento: dos cuartos (cerca y lejos) separados por la pared
      const piso = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 3.8), std(0x14223a, 0.9, 0)); piso.rotation.x = -Math.PI / 2; scene.add(piso);
      const borde = (w, d, x, z) => { const g = new THREE.EdgesGeometry(new THREE.BoxGeometry(w, 0.01, d)); const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x3A5070 })); l.position.set(x, 0.006, z); scene.add(l); };
      borde(2.4, 1.7, 0, 0.7); borde(2.4, 1.7, 0, -1.05);
      const grid = new THREE.GridHelper(9, 36, LINE, LINE); grid.material.transparent = true; grid.material.opacity = 0.35; grid.position.y = -0.005; scene.add(grid);
      const wall = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 0.09), std(0x4a6088, 0.8, 0)); wall.position.set(0, 0.25, -0.18); scene.add(wall);
      // router (abajo) con dos antenas
      const rt = new THREE.Group(); rt.add(new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.07, 0.26), std(0x2d4268, 0.5, 0.3)));
      for (const x of [-0.13, 0.13]) { const a = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.28, 12), std(0x33445e)); a.position.set(x, 0.17, -0.04); rt.add(a); }
      rt.position.set(0, 0.04, 1.55); scene.add(rt);
      // teléfonos: cerca (sobre el piso del cuarto cercano) y lejos
      const tel = (z) => { const m = new THREE.MeshStandardMaterial({ color: 0xc3cee2, roughness: 0.35, metalness: 0.3, emissive: 0x000000 }); const t = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.02, 0.3), m); t.position.set(0, 0.02, z); scene.add(t); return m; };
      const mCerca = tel(0.45), mLejos = tel(-1.1);
      // anillos de onda en el piso
      const mk = (c) => { const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.014, 8, 128), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0 })); m.rotation.x = Math.PI / 2; m.position.set(0, 0.03, 1.55); scene.add(m); return m; };
      const r5 = [mk(SKY), mk(SKY)], r24 = [mk(ACC), mk(ACC)];
      const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const st = { t: 0 };
      function draw() {
        const t = st.t;
        // cámara: pegada al router → se aleja y sube (se ve el departamento) → deriva suave
        const k = ease(Math.min(1, t / 1.7)), d = Math.max(0, t - 1.7);
        const px = -0.2 + 0.5 * k + 0.12 * d, py = 0.55 + 6.6 * k + 0.1 * d, pz = 2.9 + 2.3 * k - 0.1 * d;
        cam.position.set(px, py, pz); cam.lookAt(0, 0.05 * (1 - k), 1.55 * (1 - k) + 1.35 * k);
        const ring = (r, t0, dur, rmax) => { const p = (t - t0) / dur; if (p < 0 || p > 1) { r.material.opacity = 0; return 0; } r.scale.setScalar(0.1 + p * rmax); r.material.opacity = (1 - p) * 0.95; return 0.1 + p * rmax; };
        const a = ring(r5[0], 0.4, 1.1, 1.5), b = ring(r5[1], 1.9, 1.1, 1.5), c = ring(r24[0], 0.8, 1.5, 3.5), e = ring(r24[1], 2.3, 1.5, 3.5);
        // los teléfonos se iluminan cuando les llega la onda (distancias al router: cerca 1,1; lejos 2,65)
        const hit = (rad, dist, on) => (rad > dist ? on : 0);
        const nearOn = Math.max(hit(a, 1.1, 1), hit(b, 1.1, 1), hit(c, 1.1, 0.7), hit(e, 1.1, 0.7)); mCerca.emissive.copy(SKY).multiplyScalar(0.55 * nearOn);
        const farOn = Math.max(hit(c, 2.65, 1), hit(e, 2.65, 1)); mLejos.emissive.copy(ACC).multiplyScalar(0.55 * farOn);
        renderer.render(scene, cam);
      }
      tl.to(st, { t: 3.9, duration: 3.9, ease: 'none', onUpdate: draw }, 0);
      draw();
      window.__timelines["payoff"] = tl;   // se registra al terminar la construcción asíncrona
    });
  </script>
</template>
