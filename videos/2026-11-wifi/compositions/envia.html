<!-- ENVÍA (4,6 s) — 3D (three.js): el dispositivo convierte unos y ceros en una onda y la emite por la antena.
     La onda se aleja hacia el fondo (eje z). Cámara: pegada a la pantalla → sube y sigue la onda. Rótulo HTML que sigue a la onda. -->
<template>
  <style>#root { position: absolute; inset: 0; }</style>
  <div id="root" data-composition-id="envia" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="n-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore><div id="n-lb" class="ancla"><p id="n-et" class="bajada">ondas de radio</p></div></div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="envia"]');
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#n-et', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.25 }, 2.3);
    import('./assets/escena3d.js').then(async (M) => {
      const E = await M.crear(root), { P, V, clamp, EASE } = E;
      const lap = E.laptop(); E.scene.add(lap); lap.updateMatrixWorld(true);
      // la notebook no tiene una antena a la vista: las ondas salen de la tapa y se expanden por el piso en anillos (igual que en el payoff)
      const A = lap.localToWorld(lap.userData.emisor.clone()), dir = new V(0.35, 0.06, -1).normalize(), B = A.clone().addScaledVector(dir, 2.4);
      const anillos = [0, 1, 2, 3].map(() => E.anillo(P.acc, new V(0, 1, 0), 0.014));
      const LINEAS = ['10110100', '01101001', '11010010'];
      E.animar(tl, 4.6, (t) => {
        E.ruta(t, [
          { t: 0, p: [0.0, 0.3, 0.8], l: [0, 0.14, -0.05] },
          { t: 1.3, p: [0.5, 0.8, 1.8], l: [0.05, 0.2, -0.9], e: 'expo' },
          { t: 4.6, p: [0.6, 1.0, 2.1], l: [0.1, 0.25, -1.2], e: 'lin' }]);
        const n = Math.floor(clamp((t - 0.4) / 0.8) * 24); let rest = n, txt = LINEAS.map((l) => { const k = Math.min(8, Math.max(0, rest)); rest -= 8; return l.slice(0, k); }).join('\n');
        lap.userData.pantalla.texto(txt + (n < 24 ? '_' : ''), undefined, 54);
        anillos.forEach((r, i) => r.emitir((t - (1.5 + 0.5 * i)) / 1.6, 2.2, new V(0, 0.02, 0)));   // las ondas de radio = anillos que se expanden desde la notebook
        E.label(root.querySelector('#n-lb'), A.clone().addScaledVector(dir, 0.9).add(new V(-0.42, 0.3, 0)));
      });
      window.__timelines['envia'] = tl;
    });
  </script>
</template>
