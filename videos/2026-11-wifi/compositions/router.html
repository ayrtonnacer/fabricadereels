<!-- ROUTER (5,2 s) — 3D: la onda llega al router, éste la decodifica y la manda a internet por cable (hacia el fondo); y de vuelta, igual.
     La cadena notebook → router → internet se extiende en profundidad (eje z): la cámara avanza con los datos y vuelve. -->
<template>
  <style>#root { position: absolute; inset: 0; }</style>
  <div id="root" data-composition-id="router" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="r-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <div class="hud" data-layout-ignore><div id="r-lb" class="ancla"><div id="r-net" class="chip">Internet</div></div></div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="router"]');
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#r-net', { opacity: 0.3, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.3 }, 0);
    import('./assets/escena3d.js').then(async (M) => {
      const E = await M.crear(root), { P, V, clamp, EASE } = E;
      const lap = E.laptop(); lap.position.set(0, 0, 1.3); E.scene.add(lap);
      const rt = E.router(); rt.position.set(0, 0, -0.5); E.scene.add(rt);
      const gl = E.globo(); gl.position.set(0, 0.55, -2.7); E.scene.add(gl);
      E.scene.updateMatrixWorld(true);
      const tip = lap.localToWorld(lap.userData.emisor.clone()), rin = rt.localToWorld(rt.userData.puntaAntena.clone());
      // la señal de radio = anillos que se expanden por el piso: ida desde la notebook hacia el router, vuelta desde el router
      const ida = [0, 1, 2].map(() => E.anillo(P.acc, new V(0, 1, 0), 0.014)), vuelta = [0, 1, 2].map(() => E.anillo(P.acc, new V(0, 1, 0), 0.014));
      // el cable sale del puerto trasero del router y entra hasta el CENTRO del globo (los cables sí tocan los objetos)
      const cab = E.cable(rt.localToWorld(rt.userData.puertoTrasero.clone()), gl.position.clone());
      const pk = [0, 1, 2].map(() => { const m = E.paquete(); m.visible = false; E.scene.add(m); return m; });
      E.animar(tl, 5.2, (t) => {
        E.ruta(t, [
          { t: 0, p: [0.45, 0.7, 2.9], l: [0, 0.15, 0.4] },
          { t: 2.0, p: [0.4, 0.75, 2.4], l: [0, 0.2, -0.3], e: 'lin' },
          { t: 3.5, p: [0.3, 1.05, 1.0], l: [0, 0.4, -2.0], e: 'io' },
          { t: 5.2, p: [0.55, 0.8, 2.7], l: [0, 0.15, 0.3], e: 'io' }]);
        ida.forEach((r, i) => r.emitir((t - (0.3 + 0.35 * i)) / 1.1, 2.0, new V(tip.x, 0.02, tip.z)));
        const n = Math.floor(clamp((t - 1.3) / 0.6) * 8); rt.userData.pantalla.texto('10110100'.slice(0, n), undefined, 34, 'center');
        cab.set(EASE.out(clamp((t - 2.2) / 0.5)));
        pk.forEach((m, i) => { const a = (t - (2.7 + 0.16 * i)) / 0.6, b = (t - (3.9 + 0.12 * i)) / 0.5; const p = a < 1 ? a : 1 - b;   // ida (0→1) y vuelta (1→0); no entran al globo
          m.visible = (a > 0 && a < 1) || (b > 0 && b < 1); if (m.visible) m.position.copy(cab.at(clamp(p) * 0.82)); });
        vuelta.forEach((r, i) => r.emitir((t - (4.2 + 0.3 * i)) / 1.0, 2.0, new V(rin.x, 0.02, rin.z)));
        E.label(root.querySelector('#r-lb'), new V(0, 1.0, -2.7));
      });
      window.__timelines['router'] = tl;
    });
  </script>
</template>
