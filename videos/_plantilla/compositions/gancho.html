<!-- GANCHO (≤ 3 s de promesa) — anatomía del media kit: el cuadro 0 es la portada con subtítulo. Firma 60 px en tan arriba a la izquierda (y 262),
     título de 3–5 palabras a 140 px alineado a la izquierda desde y 350 con UNA palabra en tan (visible desde el cuadro 0, blur 3 → 0),
     objeto debajo del título. La cámara hace un dolly lento hacia el objeto y al final sale con un movimiento que empalma con la escena siguiente
     (misma dirección que la corriente del reel: docs/2-estilo/MOVIMIENTO.md). -->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #g-tit { position: absolute; left: 90px; top: 350px; width: 900px; margin: 0; font-size: 140px; line-height: .98; letter-spacing: -.03em; text-align: left; text-wrap: balance; }
    #g-firma { position: absolute; left: 90px; top: 262px; font-size: 60px; }
  </style>
  <div id="root" data-composition-id="gancho" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <canvas id="g-cv" class="canvas3d" width="1080" height="1920" data-layout-ignore></canvas>
    <h1 id="g-tit" class="titular">Título de <span class="acc">cuatro</span> palabras</h1>
    <div id="g-firma" class="firma">@ayrtonnacer</div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="gancho"]');
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#g-tit', { filter: 'blur(3px)' }, { filter: 'blur(0px)', duration: 0.25, ease: 'power3.out' }, 0);
    tl.to('#g-tit, #g-firma', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 3.2);
    import('./assets/escena3d.js').then(async (M) => {
      const E = await M.crear(root, { dy: 0 }), { THREE, P } = E;
      const g = new THREE.Group(), c = E.caja(0.5, 0.5, 0.5, E.std(0)); c.position.y = 0.25; g.add(c); E.contornear(g); E.scene.add(g);
      const punto = new THREE.Mesh(new THREE.SphereGeometry(0.035, 20, 14), E.basic(P.acc)); punto.position.set(0.25, 0.5, 0.25); E.scene.add(punto);
      E.animar(tl, 3.6, (t) => E.ruta(t, [
        { t: 0, p: [1.71, 1.56, 2.98], l: [0, 0.38, 0] },                     // = portada (empalme invisible)
        { t: 3.0, p: [1.5, 1.41, 2.63], l: [0, 0.36, 0], e: 'lin' },          // dolly lento hacia el objeto
        { t: 3.6, p: [-0.4, 1.2, 1.6], l: [-0.8, 0.8, -1.0], e: 'in' }]));  // sale hacia la izquierda (la corriente)
      window.__timelines['gancho'] = tl;
    });
  </script>
</template>
