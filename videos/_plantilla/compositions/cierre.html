<!-- CIERRE / CTA: el FOCO es el llamado ("Dale like / Seguime…"). La cámara aterriza sobre el CTA y queda quieta;
     la firma aparece después, debajo y más chica, con el acento. Nunca zoom sobre la firma (DECISIONES 2026-11-09).
     Al aterrizar el CTA suena el chinn (sfx_events.py). Para un video en bucle, ver docs/GUION.md. -->
<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .w { display: inline-block; }
    #c-cta { width: 1000px; font-size: 118px; }
    #c-firma { font-size: 58px; }
  </style>
  <div id="root" data-composition-id="cierre" data-width="1080" data-height="1920">
    <div class="fondo" data-layout-ignore></div>
    <div class="vista" data-layout-allow-overflow>
      <div class="cam"><div class="mundo">
        <div id="c-piso" class="piso" data-y="700" data-rx="90"></div>
        <h2 id="c-cta" class="titular" data-y="-150">
          <span class="w">Dale</span> <span class="w acc">like</span><br />
          <span class="w">Seguime</span> <span class="w">para</span><br />
          <span class="w">aprender</span> <span class="w">más</span><br />
          <span class="w">de</span> <span class="w acc">tema</span>
        </h2>
        <div id="c-firma" class="firma" data-y="240">@ayrtonnacer</div>
      </div></div>
    </div>
    <div class="vineta" data-layout-ignore></div>
  </div>
  <script>
    const root = document.querySelector('[data-composition-id="cierre"]');
    const tl = gsap.timeline({ paused: true });
    const cam = Camara(root, tl);

    // Llega inclinada desde atrás y aterriza de frente sobre el CTA; después, quieta (el CTA se lee).
    cam.poner({ y: -120, z: -700, rx: 14 });
    cam.ir(0, { y: 30, z: 0, rx: 5 }, 1.1, 'expo.out');

    tl.fromTo('#c-cta .w', { opacity: 0, filter: 'blur(10px)' },
      { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out', stagger: 0.06 }, 0.1);
    tl.fromTo('#c-firma', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 1.2);

    window.__timelines["cierre"] = tl;
  </script>
</template>
