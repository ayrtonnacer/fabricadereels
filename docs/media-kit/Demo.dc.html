<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;700&amp;family=Geist+Mono:wght@400;500;700&amp;display=swap"></link><style>body{margin:0;background:#000}</style></helmet>
<div style="position:relative;width:1080px;height:1920px;background:#000;overflow:hidden;font-family:'Host Grotesk',sans-serif;color:#FFFFFF">
  <div style="position:absolute;top:1180px;left:0;width:1080px;height:740px;transform:translateY({{ pisoY }}px);-webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 40%);mask-image:linear-gradient(to bottom, transparent 0%, #000 40%)"><svg viewBox="0 0 1080 740" style="width:1080px;height:740px;display:block"><path d="{{ piso }}" style="fill:none;stroke:#3a3a3a;stroke-width:1.5"></path></svg></div>

  <div style="position:absolute;inset:0;transform:translateX({{ gx }}px) scale({{ gs }});filter:blur({{ gb }}px);opacity:{{ go }}">
    <svg viewBox="0 0 1080 1920" style="position:absolute;inset:0;width:1080px;height:1920px"><path d="{{ obj }}" style="fill:none;stroke:#929292;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"></path><circle cx="{{ dotX }}" cy="{{ dotY }}" r="12" style="fill:#A8927C"></circle></svg>
    <sc-if value="{{ hasFirma }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:205px;left:0;right:0;text-align:center;font-size:60px;font-weight:700;letter-spacing:-0.01em;color:#A8927C;opacity:{{ firmaO }}">@ayrtonnacer</div></sc-if>
    <div style="position:absolute;top:{{ titY }}px;left:40px;right:40px;display:flex;flex-direction:column;align-items:center;font-size:{{ titSize }}px;line-height:0.98;font-weight:700;letter-spacing:-0.03em">
      <sc-for list="{{ lineas }}" as="l" hint-placeholder-count="2">
        <div style="display:flex;gap:0.24em;justify-content:center">
          <sc-for list="{{ l.ws }}" as="w" hint-placeholder-count="3"><span style="display:inline-block;opacity:{{ w.o }};filter:blur({{ w.b }}px);color:{{ w.c }}">{{ w.t }}</span></sc-for>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ hasRotulo }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:1220px;left:0;right:0;text-align:center;font-family:'Geist Mono',monospace;font-size:46px;color:#C7C7C7">{{ rotulo }}</div></sc-if>
    <sc-if value="{{ hasFirmaAbajo }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:1000px;left:0;right:0;text-align:center;font-size:58px;font-weight:700;letter-spacing:-0.01em;color:#A8927C;opacity:{{ firmaAbajoO }}">@ayrtonnacer</div></sc-if>
  </div>

  <sc-if value="{{ hasPasos }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:230px;left:70px;width:940px;display:flex;flex-direction:column;gap:16px">
      <div style="font-size:40px;font-weight:500;color:#C7C7C7">Paso <span style="color:#A8927C;font-weight:700">{{ pasoN }}</span> de 4</div>
      <div style="display:flex;gap:10px"><sc-for list="{{ segs }}" as="s" hint-placeholder-count="4"><div style="flex:1;height:8px;border-radius:4px;background:#1F1F1F;overflow:hidden"><div style="height:8px;width:{{ s.w }}%;background:#A8927C"></div></div></sc-for></div>
    </div>
  </sc-if>

  <sc-if value="{{ hasEtiqueta }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:240px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px">
      <div style="font-family:'Geist Mono',monospace;font-size:48px;color:#FFFFFF">{{ etiqueta }}</div>
      <div style="font-size:40px;font-weight:500;color:#C7C7C7">{{ etiquetaSig }}</div>
    </div>
  </sc-if>

  <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;top:1150px;left:60px;right:60px;display:flex;justify-content:center">
      <div style="background:rgba(0,0,0,0.86);padding:14px 28px;display:flex;gap:0.24em;flex-wrap:wrap;justify-content:center;font-size:70px;line-height:1.15;font-weight:700;letter-spacing:-0.02em">
        <sc-for list="{{ sub }}" as="w" hint-placeholder-count="3"><span style="color:{{ w.c }}">{{ w.t }}</span></sc-for>
      </div>
    </div>
  </sc-if>

  <div style="position:absolute;left:70px;right:70px;top:1800px;display:flex;justify-content:space-between;font-family:'Geist Mono',monospace;font-size:34px;color:#929292"><span>{{ nombre }}</span><span>t = {{ tTxt }} s</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;tipo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hook&quot;,&quot;pasos&quot;,&quot;transiciones&quot;,&quot;cierre&quot;],&quot;default&quot;:&quot;hook&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { t: 0 };
  componentDidMount() {
    const t0 = performance.now();
    const loop = (now) => { this.setState({ t: (now - t0) / 1000 }); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const cl = x => Math.max(0, Math.min(1, x)), eo = x => 1 - Math.pow(1 - x, 4), ei = x => x * x * x * x;
    const io = x => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2, ex = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
    const TAN = '#A8927C', W = '#FFFFFF';
    const tipo = this.props.tipo ?? 'hook';
    const D = { hook: 5.2, pasos: 8, transiciones: 7.2, cierre: 5.6 }[tipo] || 5;
    const t = this.state.t % D;

    const grid = (dims, a, b, dist, cx, cy) => {
      const u = 2 / 3, f = 1050, h = dims.map(n => n * u / 2);
      const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
      const R = ([x, y, z]) => { const x1 = x * ca + z * sa, z1 = -x * sa + z * ca; return [x1, y * cb - z1 * sb, y * sb + z1 * cb]; };
      const P = p => { const r = R(p), s = f / (dist - r[2]); return [cx + r[0] * s, cy - r[1] * s, r[2]]; };
      let d = '';
      const seg = (p, q) => { const A = P(p), B = P(q); d += `M${A[0].toFixed(1)} ${A[1].toFixed(1)} L${B[0].toFixed(1)} ${B[1].toFixed(1)} `; };
      for (let k = 0; k < 3; k++) for (const s of [-1, 1]) {
        const n = [0, 0, 0]; n[k] = s; const c = [0, 0, 0]; c[k] = s * h[k];
        const nr = R(n), cr = R(c);
        if (nr[0] * -cr[0] + nr[1] * -cr[1] + nr[2] * (dist - cr[2]) <= 0) continue;
        const [i, j] = [0, 1, 2].filter(x => x !== k);
        for (const [p, q] of [[i, j], [j, i]]) for (let m = 0; m <= dims[p]; m++) {
          const A = [0, 0, 0], B = [0, 0, 0];
          A[k] = B[k] = s * h[k]; A[p] = B[p] = -h[p] + m * u; A[q] = -h[q]; B[q] = h[q];
          seg(A, B);
        }
      }
      let best = null;
      for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) { const p = P([x * h[0], y * h[1], z * h[2]]); if (!best || p[2] > best[2]) best = p; }
      return { d, dot: best };
    };
    const palabras = (lineas, tiempos, modo) => {
      let n = 0;
      return lineas.map(l => ({ ws: l.map(w0 => {
        const acc = w0[0] === '*', txt = acc ? w0.slice(1) : w0, t0 = tiempos ? tiempos[n++] : -1;
        const q = eo(cl((t - t0) / 0.18));
        const o = modo === 'hook' ? .85 + .15 * q : modo === 'in' ? q : 1, b = modo === 'hook' ? 3 * (1 - q) : modo === 'in' ? 10 * (1 - q) : 0;
        return { t: txt, o: o.toFixed(3), b: b.toFixed(2), c: acc ? TAN : W };
      }) }));
    };
    let piso = '';
    for (let i = -12; i <= 12; i++) { const xb = 540 + i * 200, xt = 540 + (xb - 540) * 500 / 1240; piso += `M${xt.toFixed(1)} 0 L${xb} 740 `; }
    [0, 40, 95, 170, 270, 400, 570].forEach(y => piso += `M0 ${y} H1080 `);

    const v = { piso, pisoY: 0, gx: 0, gs: 1, gb: 0, go: 1, hasFirma: false, firmaO: 1, hasFirmaAbajo: false, firmaAbajoO: 0, lineas: [], titY: 330, titSize: 120,
      hasRotulo: false, rotulo: '', hasPasos: false, pasoN: 1, segs: [], hasEtiqueta: false, etiqueta: '', etiquetaSig: '', hasSub: false, sub: [], obj: '', dotX: -99, dotY: -99,
      tTxt: t.toFixed(1).replace('.', ','), nombre: '' };
    const setObj = g => { v.obj = g.d; v.dotX = g.dot[0].toFixed(1); v.dotY = g.dot[1].toFixed(1); };

    if (tipo === 'hook') {
      v.nombre = 'hook · cuadro 0'; v.hasFirma = true; v.firmaO = (.6 + .4 * cl(t / .25)).toFixed(3);
      v.lineas = palabras([['Para', 'una', 'máquina,'], ['son', '*lo', '*mismo']], [.05, .11, .17, .23, .29, .35], 'hook');
      setObj(grid([3, 3, 3], .55 + .1 * t, .38, 5.8 - .8 * io(cl(t / 4.4)), 540, 790));
      const bloques = [['Para', 'una', 'máquina,'], ['una', 'foto,', 'una', 'canción'], ['y', 'un', 'texto'], ['son', 'lo', 'mismo.']];
      let idx = 0, bi = -1, wi = -1;
      bloques.forEach((bl, b) => bl.forEach((w, i) => { if (t >= .3 + idx * .3) { bi = b; wi = i; } idx++; }));
      if (bi >= 0) { v.hasSub = true; v.sub = bloques[bi].map((w, i) => ({ t: w, c: i === wi ? TAN : W })); }
      const q = ei(cl((t - 4.85) / .35)); v.gs = (1 + .2 * q).toFixed(3); v.gb = (10 * q).toFixed(2); v.go = (1 - q).toFixed(3);
    } else if (tipo === 'pasos') {
      v.nombre = 'paso N de M · curva-izq'; v.hasPasos = true; v.titY = 420; v.titSize = 110;
      const k = Math.floor(t / 2), u = t - k * 2;
      const pasos = [[[1, 1, 1], ['Un', 'número:'], ['un', '*escalar']], [[3, 1, 1], ['Una', 'lista:'], ['un', '*vector']], [[3, 3, 1], ['Una', 'planilla:'], ['una', '*matriz']], [[3, 3, 3], ['Un', 'bloque:'], ['un', '*tensor']]];
      const [dims, l1, l2] = pasos[k];
      v.pasoN = k + 1; v.lineas = palabras([l1, l2], null, 'fijo');
      v.segs = [0, 1, 2, 3].map(i => ({ w: i < k ? 100 : i === k ? (100 * eo(cl(u / .4))).toFixed(1) : 0 }));
      setObj(grid(dims, .6 + .12 * t, .4, 5.6, 540, 860));
      if (u < .35) { const q = eo(u / .35); v.gx = (230 * (1 - q)).toFixed(1); v.go = (.35 + .65 * q).toFixed(3); v.gb = (8 * (1 - q)).toFixed(2); }
      else if (u > 1.75) { const q = ei((u - 1.75) / .25); v.gx = (-230 * q).toFixed(1); v.go = (1 - q).toFixed(3); v.gb = (8 * q).toFixed(2); }
    } else if (tipo === 'transiciones') {
      v.hasEtiqueta = true; v.hasRotulo = true; v.lineas = [];
      const L = 2.4, k = Math.floor(t / L), u = t - k * L;
      const fases = [[[3, 3, 3], 'tensor'], [[3, 3, 1], 'matriz'], [[3, 1, 1], 'vector']];
      const tipos = ['curva', 'zoom', 'foco'], info = { curva: ['curva-izq', 'avance neutro: lo que sigue'], zoom: ['zoom', 'ir más hondo en la misma idea'], foco: ['foco', 'el corte que se quiere ver'] };
      const sal = tipos[k], ent = tipos[(k + 2) % 3];
      v.etiqueta = 'salida: ' + info[sal][0]; v.etiquetaSig = info[sal][1]; v.nombre = 'catálogo de transiciones'; v.rotulo = fases[k][1];
      setObj(grid(fases[k][0], .55 + .15 * t, .4, 5.4, 540, 860));
      if (u < .35) { const q = eo(u / .35);
        if (ent === 'curva') { v.gx = (230 * (1 - q)).toFixed(1); v.go = (.35 + .65 * q).toFixed(3); v.gb = (8 * (1 - q)).toFixed(2); }
        if (ent === 'zoom') { v.gs = (.75 + .25 * q).toFixed(3); v.gb = (10 * (1 - q)).toFixed(2); }
        if (ent === 'foco') { v.gs = (1.06 - .06 * q).toFixed(3); v.gb = (10 * (1 - q)).toFixed(2); }
      } else if (u > L - .25) { const q = ei((u - (L - .25)) / .25);
        if (sal === 'curva') { v.gx = (-230 * q).toFixed(1); v.go = (1 - q).toFixed(3); v.gb = (8 * q).toFixed(2); }
        if (sal === 'zoom') { v.gs = (1 + .2 * q).toFixed(3); v.gb = (10 * q).toFixed(2); v.go = (1 - q * q).toFixed(3); }
        if (sal === 'foco') { v.gs = (1 + .06 * q).toFixed(3); v.gb = (10 * q).toFixed(2); }
      }
    } else {
      v.nombre = 'cierre · llamado y firma'; v.titY = 520; v.titSize = 100;
      v.lineas = palabras([['Dale', '*like', 'y', 'seguime'], ['para', 'aprender', 'más'], ['sobre', '*Linux']], [.65, .87, 1.25, 1.34, 1.66, 1.8, 2.2, 2.38, 2.63], 'in');
      v.pisoY = (320 * (1 - ex(cl(t / 1.2)))).toFixed(1);
      v.hasFirmaAbajo = true; v.firmaAbajoO = eo(cl((t - 3.8) / .3)).toFixed(3);
      v.go = (1 - cl((t - 5.3) / .3)).toFixed(3);
    }
    return v;
  }
}
</script>
</body>
</html>
